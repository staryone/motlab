<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Scene (2D)</title>
<style>
  /* The video's font files go next to the page; point Head at them. Without the file it falls back to system-ui. */
  @font-face { font-family: Head; src: url("fonts/Head.ttf") format("truetype"); }
  html, body { margin: 0; height: 100%; background: #000; display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, 100vh * 16 / 9); aspect-ratio: 16 / 9; }
</style></head><body><canvas id="c"></canvas>
<script>
// A plain 2D starting point: the page contract, one block of beat times, timing helpers and one example move. It has
// no look of its own. The look comes from the user's references, another skill, or a style from motlab-styles, whose
// templates start from the same contract. Copy the page, rename it and replace draw().
// Page contract: renderAt(t), TOTAL, ready, EVENTS, ?t=, ?scale=.
const W = 1920, H = 1080;
const params = new URLSearchParams(location.search), SCALE = parseFloat(params.get('scale') || '1');
const cv = document.querySelector('#c'), ctx = cv.getContext('2d');
cv.width = Math.round(W * SCALE); cv.height = Math.round(H * SCALE);

// Every time in the scene comes from here, so a note like "slower here" changes one number.
const B = { moveIn: 0.4, moveEnd: 1.6, title: 1.2, END: 4 };
window.EVENTS = [{ name: 'land', t: B.moveEnd }, { name: 'title', t: B.title }];

// ---- timing helpers (the same as in /__motlab/motion.js, which a module page can import instead) ----
const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, from, to) => clamp((t - from) / (to - from));   // 0..1 between two times
const outCubic = k => 1 - (1 - clamp(k)) ** 3;
const inOutCubic = k => (k = clamp(k), k < 0.5 ? 4 * k ** 3 : 1 - (2 - 2 * k) ** 3 / 2);

// ---- optional: held poses and a seeded jitter, for animation that should step instead of glide ----
const POSES = 0;   // 0 = smooth time; 12 or 8 holds that many poses a second (render at 24 fps then)
const hash = n => { const s = Math.sin(n * 91.345) * 24634.6345; return s - Math.floor(s); };   // the same every render

function draw(g, t) {   // in the page's own 1920x1080 units
  g.fillStyle = '#1c1c1c'; g.fillRect(0, 0, W, H);

  const k = inOutCubic(prog(t, B.moveIn, B.moveEnd));
  g.beginPath(); g.arc(lerp(360, W / 2, k), H / 2, 90, 0, Math.PI * 2);
  g.fillStyle = '#e8e8e8'; g.fill();

  const a = outCubic(prog(t, B.title, B.title + 0.5));
  g.globalAlpha = a; g.fillStyle = '#e8e8e8'; g.textAlign = 'center';
  g.font = `600 64px Head, system-ui, sans-serif`;
  g.fillText('Replace this scene.', W / 2, H / 2 + 220 - 20 * (1 - a));
  g.globalAlpha = 1;
}

function render(t) {
  const time = POSES ? Math.floor(t * POSES + 1e-6) / POSES : t;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  draw(ctx, time);
}

window.TOTAL = B.END;
window.renderAt = render;
window.ready = document.fonts.load('600 64px Head').catch(() => {}).then(() => {
  // Opened on its own, the page loops. In a render or in the viewer (an iframe), only renderAt draws.
  if (params.has('t') || window.top !== window) render(parseFloat(params.get('t') || '0'));
  else requestAnimationFrame(function loop(ms) { render((ms / 1000) % B.END); requestAnimationFrame(loop); });
  return true;
});
</script></body></html>
